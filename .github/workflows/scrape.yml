name: scrape
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: databr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -q -r scraper/requirements.txt
      - run: python scraper/scrape.py --data databr
      - name: commit state to data branch
        run: |
          cd databr
          git config user.name "parkscout-bot"
          git config user.email "parkscout-bot@users.noreply.github.com"
          git add -A
          git commit -m "scrape $(date -u +%FT%TZ)" || exit 0
          git push
